<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>살아있는 면접관 아바타 · WonderfulCrew</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;600;700&family=DM+Serif+Display&display=swap" rel="stylesheet">
<style>
:root{--gold:#C9A84C;--navy:#1A2340;--cream:#FAF7F0;}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Noto Sans KR',sans-serif;background:var(--cream);color:#1A1A1A;padding:24px 16px 60px;}
.wrap{max-width:520px;margin:0 auto;}
h1{font-family:'DM Serif Display',serif;font-size:1.5rem;color:var(--navy);text-align:center;margin-bottom:6px;}
.sub{text-align:center;color:#5A5048;font-size:0.86rem;margin-bottom:20px;line-height:1.6;}
.avatar-box{width:100%;aspect-ratio:1/1;max-width:380px;margin:0 auto 16px;border-radius:18px;overflow:hidden;background:#e8e2d6;box-shadow:0 12px 30px -14px rgba(26,35,64,0.5);position:relative;}
.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-bottom:14px;}
.btn{padding:12px 22px;border:none;border-radius:26px;font-family:inherit;font-size:0.9rem;font-weight:700;cursor:pointer;}
.btn-gold{background:linear-gradient(135deg,#E8C96A,#C9A84C);color:#fff;}
.btn-navy{background:var(--navy);color:#fff;}
.btn-ghost{background:#fff;border:1.5px solid var(--gold);color:var(--navy);}
.samples{display:flex;gap:8px;justify-content:center;margin-bottom:14px;flex-wrap:wrap;}
.samples img{width:52px;height:52px;object-fit:cover;border-radius:10px;border:2px solid transparent;cursor:pointer;}
.samples img:hover{border-color:var(--gold);}
.tuner{background:#fff;border-radius:14px;padding:16px 18px;margin-top:10px;font-size:0.82rem;color:#5A5048;}
.tuner h3{font-size:0.86rem;color:var(--navy);margin-bottom:10px;}
.tuner label{display:flex;align-items:center;gap:8px;margin-bottom:8px;}
.tuner label span{width:64px;flex-shrink:0;}
.tuner input[type=range]{flex:1;accent-color:var(--gold);}
.hint{font-size:0.78rem;color:#8A8070;text-align:center;margin-top:10px;line-height:1.6;}
.q{background:var(--navy);color:#fff;border-radius:12px;padding:14px 16px;margin-bottom:14px;font-size:0.92rem;line-height:1.6;text-align:center;}
.q b{color:#E8C96A;}
</style>
<script src="tts-map.js?v=3"></script>
</head>
<body>
<div class="wrap">
  <h1>살아있는 면접관 아바타</h1>
  <p class="sub">사진 한 장이면 면접관이 눈을 깜빡이고 숨쉬며 말을 겁니다.<br>영상 생성 없이 — 롤플레이·파이널·CV드롭에 그대로 들어갑니다.</p>

  <div class="avatar-box" id="avatarBox"></div>

  <div class="samples" id="samples"></div>

  <div class="row">
    <label class="btn btn-ghost" style="display:inline-flex;align-items:center;">사진 올리기<input type="file" id="up" accept="image/*" style="display:none;"></label>
    <button class="btn btn-gold" id="speakBtn">▶ 말 걸어보기</button>
  </div>

  <div class="q" id="qBox">면접관: <b id="qText">Tell me about yourself.</b></div>

  <div class="tuner">
    <h3>👁 눈·입 위치 미세조정 (내 사진에 맞추기)</h3>
    <label><span>눈 높이</span><input type="range" id="eyeY" min="25" max="55" value="35"></label>
    <label><span>눈 간격</span><input type="range" id="eyeGap" min="6" max="18" value="10.5"></label>
    <label><span>입 높이</span><input type="range" id="mouthY" min="45" max="75" value="53"></label>
    <div class="hint" id="tuneOut">현재 값이 잘 맞으면 그대로 두세요.</div>
  </div>

  <p class="hint">※ 아바타·눈꺼풀·입은 화면 위 레이어라 <b>녹화·저장에는 남지 않습니다.</b><br>실사 영상 생성(느리고 어색함) 대신, 즉각 반응하는 가벼운 방식입니다.</p>
</div>

<script src="js/live-avatar.js?v=1"></script>
<script>
var box=document.getElementById('avatarBox');
var SAMPLES=['images/small%20talk2.png','images/analysis-face.png','images/photo-good.png'];
var av=null;
function mountAvatar(url){ if(av)av.destroy(); box.innerHTML=''; av=LiveAvatar.mount(box,url); applyTune(); }
// 샘플 썸네일
var sc=document.getElementById('samples');
SAMPLES.forEach(function(u){ var im=document.createElement('img'); im.src=u; im.onclick=function(){mountAvatar(u);}; sc.appendChild(im); });
mountAvatar(SAMPLES[0]);

// 업로드
document.getElementById('up').addEventListener('change',function(e){
  var f=e.target.files[0]; if(!f)return;
  var r=new FileReader(); r.onload=function(){ mountAvatar(r.result); }; r.readAsDataURL(f);
});

// 튜너
function applyTune(){
  if(!av)return;
  var eyeY=+document.getElementById('eyeY').value/100;
  var eyeGap=+document.getElementById('eyeGap').value/100;
  var mouthY=+document.getElementById('mouthY').value/100;
  av.tune({eyeY:eyeY, eyeGap:eyeGap, mouthY:mouthY});
  document.getElementById('tuneOut').textContent='눈높이 '+(eyeY*100).toFixed(0)+'% · 눈간격 '+(eyeGap*100).toFixed(1)+'% · 입높이 '+(mouthY*100).toFixed(0)+'%';
}
['eyeY','eyeGap','mouthY'].forEach(function(id){ document.getElementById(id).addEventListener('input',applyTune); });

// 말 걸어보기 — TTS(면접 질문) 재생 중 입 움직임
var QS=['Tell me about yourself.','Why do you want this job?','How do you handle stress?','Describe your best service experience.'];
var qi=0;
function playQuestion(){
  var q=QS[qi%QS.length]; qi++;
  document.getElementById('qText').textContent=q;
  av.speak();
  var done=function(){ av.stop(); };
  try{
    if('speechSynthesis' in window){
      speechSynthesis.cancel();
      var u=new SpeechSynthesisUtterance(q); u.lang='en-US'; u.rate=0.95;
      u.onend=done; u.onerror=done;
      speechSynthesis.speak(u);
      // 안전장치: 최대 6초 후 정지
      setTimeout(done, 6000);
    } else { setTimeout(done, 2500); }
  }catch(e){ setTimeout(done, 2500); }
}
document.getElementById('speakBtn').onclick=playQuestion;
</script>
</body>
</html>
