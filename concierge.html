<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Vinpearl AI Concierge · Multilingual Resort Assistant</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&family=Noto+Sans+KR:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--teal:#0E7C86;--teal-d:#0A5A62;--gold:#C9A84C;--sand:#F6F1E7;--ink:#12333A;}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Poppins','Noto Sans KR',sans-serif;background:var(--sand);color:var(--ink);}
.hero{background:linear-gradient(135deg,#0E7C86,#0A5A62);color:#fff;padding:18px 20px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;}
.brand .logo{font-family:'Poppins';font-weight:700;font-size:1.25rem;letter-spacing:0.02em;}
.brand .logo span{color:#F4D06A;}
.brand .tag{font-size:0.72rem;opacity:0.85;}
.langs{display:flex;gap:6px;flex-wrap:wrap;}
.langs button{background:rgba(255,255,255,0.14);border:1px solid rgba(255,255,255,0.3);color:#fff;border-radius:20px;padding:6px 12px;font-size:0.8rem;cursor:pointer;font-family:inherit;}
.langs button.on{background:#F4D06A;color:#0A5A62;font-weight:700;border-color:#F4D06A;}
.wrap{max-width:760px;margin:0 auto;padding:18px 16px 30px;}
.card{background:#fff;border-radius:18px;box-shadow:0 14px 40px -22px rgba(14,124,134,0.5);overflow:hidden;}
.chat{height:min(56vh,460px);overflow-y:auto;padding:18px;display:flex;flex-direction:column;gap:12px;background:linear-gradient(180deg,#fbfaf6,#fff);}
.msg{max-width:82%;padding:11px 15px;border-radius:16px;font-size:0.92rem;line-height:1.6;white-space:pre-wrap;}
.msg.bot{background:var(--sand);color:var(--ink);border-bottom-left-radius:4px;align-self:flex-start;}
.msg.me{background:var(--teal);color:#fff;border-bottom-right-radius:4px;align-self:flex-end;}
.msg.bot .who{font-size:0.68rem;color:var(--teal);font-weight:700;margin-bottom:3px;}
.typing{align-self:flex-start;color:#8aa;font-size:0.85rem;padding:6px 15px;}
.chips{display:flex;gap:8px;flex-wrap:wrap;padding:12px 16px 4px;}
.chips button{background:#fff;border:1.5px solid var(--teal);color:var(--teal);border-radius:18px;padding:7px 14px;font-size:0.8rem;cursor:pointer;font-family:inherit;}
.chips button:hover{background:var(--teal);color:#fff;}
.inbar{display:flex;gap:8px;padding:12px 16px 16px;border-top:1px solid #eee;}
.inbar input{flex:1;border:1.5px solid #d8d0be;border-radius:24px;padding:12px 16px;font-family:inherit;font-size:0.92rem;outline:none;}
.inbar input:focus{border-color:var(--teal);}
.inbar button{background:linear-gradient(135deg,#0E7C86,#0A5A62);color:#fff;border:none;border-radius:24px;padding:0 22px;font-weight:700;cursor:pointer;font-family:inherit;}
.foot{text-align:center;font-size:0.74rem;color:#7a8a8c;margin-top:16px;line-height:1.6;}
.hero .sub2{width:100%;font-size:0.78rem;opacity:0.9;}
.spk{background:none;border:none;cursor:pointer;font-size:0.9rem;margin-left:6px;opacity:0.6;}
</style>
</head>
<body>
<div class="hero">
  <div class="brand">
    <div>
      <div class="logo">Vinpearl <span>AI Concierge</span></div>
      <div class="tag">Nha Trang &middot; Resort &amp; Theme Park</div>
    </div>
  </div>
  <div class="langs" id="langs"></div>
  <div class="sub2" id="welcomeSub"></div>
</div>

<div class="wrap">
  <div class="card">
    <div class="chat" id="chat"></div>
    <div class="chips" id="chips"></div>
    <div class="inbar">
      <input id="inp" placeholder="Ask me anything...">
      <button id="send">Send</button>
    </div>
  </div>
  <p class="foot">Multilingual AI concierge demo &middot; powered by WonderfulCrew AI<br>Low-cost engine (Haiku) &middot; Voice guidance (TTS) supported</p>
</div>

<script>
var LANGS=[
  {c:'ko',f:'🇰🇷',n:'한국어'},
  {c:'en',f:'🇺🇸',n:'English'},
  {c:'zh',f:'🇨🇳',n:'中文'},
  {c:'ja',f:'🇯🇵',n:'日本語'},
  {c:'ru',f:'🇷🇺',n:'Русский'},
  {c:'vi',f:'🇻🇳',n:'Tiếng Việt'}
];
var UI={
  ko:{welcome:'안녕하세요! Vinpearl 리조트 AI 컨시어지입니다. 무엇을 도와드릴까요? 😊',ph:'무엇이든 물어보세요...',send:'보내기',sub:'리조트·테마파크 안내를 원하는 언어로 물어보세요',chips:['인기 놀이기구 추천','한식당 어디 있나요?','공항 셔틀 시간','워터파크 입장권']},
  en:{welcome:'Hello! I am the Vinpearl Resort AI Concierge. How can I help you today? 😊',ph:'Ask me anything...',send:'Send',sub:'Ask about the resort & theme park in your language',chips:['Top rides to try','Where is a Korean restaurant?','Airport shuttle times','Water park tickets']},
  zh:{welcome:'您好！我是 Vinpearl 度假村 AI 礼宾助手。有什么可以帮您？😊',ph:'请问有什么可以帮您...',send:'发送',sub:'用您的语言询问度假村和主题公园',chips:['热门游乐设施','哪里有韩国餐厅？','机场班车时间','水上乐园门票']},
  ja:{welcome:'こんにちは！Vinpearlリゾートの AIコンシェルジュです。ご用件をどうぞ 😊',ph:'何でもお聞きください...',send:'送信',sub:'リゾートとテーマパークをお好きな言語で',chips:['人気アトラクション','韓国料理店はどこ？','空港シャトルの時間','ウォーターパーク入場券']},
  ru:{welcome:'Здравствуйте! Я AI-консьерж курорта Vinpearl. Чем могу помочь? 😊',ph:'Спрашивайте что угодно...',send:'Отправить',sub:'Спрашивайте о курорте на вашем языке',chips:['Лучшие аттракционы','Где корейский ресторан?','Расписание шаттла','Билеты в аквапарк']},
  vi:{welcome:'Xin chào! Tôi là trợ lý AI của khu nghỉ dưỡng Vinpearl. Tôi có thể giúp gì cho bạn? 😊',ph:'Hỏi bất cứ điều gì...',send:'Gửi',sub:'Hỏi về khu nghỉ dưỡng bằng ngôn ngữ của bạn',chips:['Trò chơi nổi bật','Nhà hàng Hàn Quốc ở đâu?','Giờ xe đưa đón sân bay','Vé công viên nước']}
};
var LNAME={ko:'Korean',en:'English',zh:'Chinese',ja:'Japanese',ru:'Russian',vi:'Vietnamese'};
var lang='ko', history=[];

function SYS(){
  return 'You are the official multilingual AI concierge for Vinpearl Nha Trang, a large integrated resort and theme park (VinWonders) in Vietnam operated by VinGroup. '+
  'You warmly help international guests with: attractions and rides, restaurants (including Korean, Japanese, Chinese, halal), shuttle and transport, tickets and opening hours, hotel services, spa and wellness, and recommendations. '+
  'ALWAYS reply ONLY in '+LNAME[lang]+'. Keep answers friendly, concise (2-4 sentences), concrete and helpful. If you do not know an exact detail, give a reasonable typical answer and suggest confirming at the front desk or app. Warm hospitality tone with an occasional emoji.';
}
function renderLangs(){
  var el=document.getElementById('langs');el.innerHTML='';
  LANGS.forEach(function(L){var b=document.createElement('button');b.textContent=L.f+' '+L.n;b.className=(L.c===lang?'on':'');
    b.onclick=function(){lang=L.c;history=[];renderLangs();resetChat();};el.appendChild(b);});
}
function resetChat(){
  var u=UI[lang];
  document.getElementById('chat').innerHTML='';
  document.getElementById('inp').placeholder=u.ph;
  document.getElementById('send').textContent=u.send;
  document.getElementById('welcomeSub').textContent=u.sub;
  addMsg('bot',u.welcome);
  var ch=document.getElementById('chips');ch.innerHTML='';
  u.chips.forEach(function(q){var b=document.createElement('button');b.textContent=q;b.onclick=function(){ask(q);};ch.appendChild(b);});
}
function addMsg(who,text){
  var chat=document.getElementById('chat');var d=document.createElement('div');d.className='msg '+who;
  if(who==='bot'){d.innerHTML='<div class="who">AI Concierge</div>'+escapeHtml(text)+'<button class="spk" title="Listen">🔊</button>';
    d.querySelector('.spk').onclick=function(){speak(text);};}
  else d.textContent=text;
  chat.appendChild(d);chat.scrollTop=chat.scrollHeight;return d;
}
function escapeHtml(s){return String(s).replace(/[&<>]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;'}[c];});}
function speak(t){try{if('speechSynthesis' in window){speechSynthesis.cancel();var u=new SpeechSynthesisUtterance(t);var map={ko:'ko-KR',en:'en-US',zh:'zh-CN',ja:'ja-JP',ru:'ru-RU',vi:'vi-VN'};u.lang=map[lang]||'en-US';u.rate=0.98;speechSynthesis.speak(u);}}catch(e){}}

async function ask(q){
  if(!q||!q.trim())return;
  addMsg('me',q);
  history.push({role:'user',content:q});
  var chat=document.getElementById('chat');
  var t=document.createElement('div');t.className='typing';t.textContent='···';chat.appendChild(t);chat.scrollTop=chat.scrollHeight;
  try{
    var res=await fetch('/api/ai',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({model:'claude-haiku-4-5-20251001',max_tokens:400,system:SYS(),messages:history})});
    var data=await res.json();
    var txt=(data&&data.content&&data.content[0]&&data.content[0].text)||(data&&data.text)||'';
    t.remove();
    if(!txt){addMsg('bot','(demo) AI response unavailable. Please try again shortly.');return;}
    history.push({role:'assistant',content:txt});
    addMsg('bot',txt);
  }catch(e){t.remove();addMsg('bot','Network error. Please try again.');}
}
document.getElementById('send').onclick=function(){var i=document.getElementById('inp');ask(i.value);i.value='';};
document.getElementById('inp').addEventListener('keydown',function(e){if(e.key==='Enter'){var i=this;ask(i.value);i.value='';}});
renderLangs();resetChat();
</script>
</body>
</html>
