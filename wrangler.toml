name = "wonderfulcrew"
compatibility_date = "2026-01-01"
pages_build_output_dir = "."

# 버셀 vercel.json 의 crons 와 동일한 스케줄 (UTC 기준). 위 _worker.js 의
# CRON_ROUTES 키와 문자열이 정확히 일치해야 scheduled() 가 올바른 API 로 라우팅한다.
# 주의: Cloudflare 대시보드에서 "Git 연결"로만 배포하면 이 [triggers] 가 자동
# 반영 안 될 수 있음 — 최초 1회는 `wrangler pages deploy` 로 배포하거나,
# 대시보드 > Workers & Pages > 프로젝트 > Settings > Trigger Events 에서
# 아래와 동일한 Cron Trigger 를 직접 등록해서 확인할 것.
[triggers]
crons = [
  "0 * * * *",   # reconcile-subscriptions — 매시간
  "0 4 * * *",   # generate-sns-content — 매일 04:00 UTC
  "0 */2 * * *", # sns-publish — 2시간마다
  "0 10 * * *",  # marketing-push-cron — 매일 10:00 UTC
  "0 5 * * *",   # seo-ping — 매일 05:00 UTC
  "0 9 * * *",   # email-campaign-cron — 매일 09:00 UTC
]
