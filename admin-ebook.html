<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>전자책 코드 관리 · WonderfulCrew</title>
<style>
:root{--gold:#C9A84C;--navy:#1A2340;--cream:#FAF7F0;}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Noto Sans KR',sans-serif;background:var(--cream);color:#1A1A1A;padding:32px 20px;}
.wrap{max-width:480px;margin:0 auto;background:#fff;border-radius:16px;padding:28px 26px;box-shadow:0 8px 30px rgba(0,0,0,0.08);}
h1{font-size:1.2rem;color:var(--navy);margin-bottom:4px;}
.sub{font-size:0.8rem;color:#888;margin-bottom:22px;}
label{display:block;font-size:0.8rem;color:#555;margin:14px 0 6px;}
input{width:100%;padding:11px 14px;border:1px solid #ddd;border-radius:8px;font-size:0.9rem;}
.row{display:flex;align-items:center;gap:8px;margin-top:14px;}
.row input[type=checkbox]{width:auto;}
button{width:100%;margin-top:20px;padding:13px;border:none;border-radius:22px;background:linear-gradient(135deg,#E8C96A,#C9A84C);color:#fff;font-weight:700;font-size:0.9rem;cursor:pointer;}
button.secondary{background:var(--navy);margin-top:8px;}
.status{margin-top:16px;padding:12px 14px;border-radius:8px;font-size:0.82rem;line-height:1.6;display:none;}
.status.ok{background:#EAF6EC;color:#1E7A34;display:block;}
.status.err{background:#FDECEC;color:#B3261E;display:block;}
.stat{margin-top:20px;font-size:0.82rem;color:#666;border-top:1px solid #eee;padding-top:14px;}
</style>
</head>
<body>
<div class="wrap">
  <h1>📘 라이브 완주자 전자책</h1>
  <div class="sub">라이브 시작 전, 이번 회차의 코드와 PDF 링크를 세팅하세요. 라이브 마지막에 코드를 알려주면 참석자가 ebook.html에서 입력해 다운로드/이메일을 받습니다.</div>

  <label>코드 (라이브 마지막에 공개할 값)</label>
  <input id="code" placeholder="예: WCLIVE0920">

  <label>PDF 다운로드 링크 (Supabase Storage 공개 URL 등)</label>
  <input id="fileUrl" placeholder="https://...supabase.co/storage/v1/object/public/wonderfulcrew/ebooks/....pdf">

  <label>전자책 제목</label>
  <input id="title" placeholder="합격 비법 전자책">

  <div class="row"><input type="checkbox" id="active" checked><label style="margin:0;">지금 활성화 (체크 해제 시 참석자가 받을 수 없음)</label></div>

  <button onclick="loadConfig()">불러오기</button>
  <button class="secondary" onclick="saveConfig()">저장하기</button>

  <div id="status" class="status"></div>
  <div id="stat" class="stat"></div>
</div>

<script>
function adminKey(){ return prompt('관리자 키:', 'wc-push-admin-2026') || ''; }

async function loadConfig(){
  var status = document.getElementById('status');
  status.className = 'status'; status.style.display='none';
  try{
    var res = await fetch('/api/ebook-admin', { headers: { 'Authorization': 'Bearer ' + adminKey() } });
    var data = await res.json();
    if(!res.ok || !data.ok){ status.className='status err'; status.textContent = data.error || '불러오기 실패'; status.style.display='block'; return; }
    var c = data.config || {};
    document.getElementById('code').value = c.code || '';
    document.getElementById('fileUrl').value = c.file_url || '';
    document.getElementById('title').value = c.title || '';
    document.getElementById('active').checked = c.active !== false;
    document.getElementById('stat').textContent = '지금까지 총 ' + (data.unlockCount || 0) + '건 발급됨';
    status.className='status ok'; status.textContent='불러왔어요.'; status.style.display='block';
  }catch(e){ status.className='status err'; status.textContent = e.message; status.style.display='block'; }
}

async function saveConfig(){
  var status = document.getElementById('status');
  status.className = 'status'; status.style.display='none';
  var code = document.getElementById('code').value.trim();
  var fileUrl = document.getElementById('fileUrl').value.trim();
  var title = document.getElementById('title').value.trim();
  var active = document.getElementById('active').checked;
  if(!code){ status.className='status err'; status.textContent='코드를 입력하세요.'; status.style.display='block'; return; }
  try{
    var res = await fetch('/api/ebook-admin', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + adminKey() },
      body: JSON.stringify({ code: code, fileUrl: fileUrl, title: title, active: active })
    });
    var data = await res.json();
    if(!res.ok || !data.ok){ status.className='status err'; status.textContent = data.error || '저장 실패'; status.style.display='block'; return; }
    status.className='status ok'; status.textContent='저장 완료! ebook.html에서 바로 동작해요.'; status.style.display='block';
  }catch(e){ status.className='status err'; status.textContent = e.message; status.style.display='block'; }
}
</script>
</body>
</html>
