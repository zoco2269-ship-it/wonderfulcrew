<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Learn Korean with AI · WonderfulCrew</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&family=Noto+Sans+KR:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--indigo:#4B5FD6;--indigo-d:#33429E;--rose:#FF6F91;--sand:#F5F5FB;--ink:#20233A;}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Poppins','Noto Sans KR',sans-serif;background:var(--sand);color:var(--ink);}
.hero{background:linear-gradient(135deg,#4B5FD6,#33429E);color:#fff;padding:18px 20px;}
.hero .top{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;}
.logo{font-weight:800;font-size:1.25rem;}
.logo span{color:#FFC94D;}
.tag{font-size:0.74rem;opacity:0.85;margin-top:2px;}
.langs{display:flex;gap:6px;flex-wrap:wrap;}
.langs button{background:rgba(255,255,255,0.14);border:1px solid rgba(255,255,255,0.3);color:#fff;border-radius:18px;padding:5px 11px;font-size:0.78rem;cursor:pointer;font-family:inherit;}
.langs button.on{background:#FFC94D;color:#33429E;font-weight:700;border-color:#FFC94D;}
.wrap{max-width:760px;margin:0 auto;padding:16px 16px 34px;}
.topics{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin:14px 0;}
.topics button{background:#fff;border:1.5px solid #DfE0F2;color:var(--indigo);border-radius:20px;padding:8px 15px;font-size:0.86rem;font-weight:600;cursor:pointer;font-family:inherit;}
.topics button.on{background:var(--indigo);color:#fff;border-color:var(--indigo);}
.card{background:#fff;border-radius:18px;box-shadow:0 14px 40px -24px rgba(75,95,214,0.5);overflow:hidden;}
.chat{height:min(52vh,440px);overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:12px;background:linear-gradient(180deg,#fbfbff,#fff);}
.msg{max-width:88%;padding:12px 15px;border-radius:16px;font-size:0.92rem;line-height:1.6;}
.msg.me{background:var(--indigo);color:#fff;align-self:flex-end;border-bottom-right-radius:4px;}
.msg.bot{background:#F0F1FB;color:var(--ink);align-self:flex-start;border-bottom-left-radius:4px;white-space:pre-wrap;}
.msg.bot .who{font-size:0.66rem;color:var(--indigo);font-weight:800;margin-bottom:4px;}
.kline{display:flex;align-items:center;gap:8px;margin:7px 0;padding:8px 10px;background:#fff;border-radius:10px;border:1px solid #EDEEF9;}
.kline .ko{font-weight:700;color:var(--ink);font-size:0.98rem;}
.kline .ro{color:#8A8FB5;font-size:0.8rem;}
.kline .tr{color:#5A5F80;font-size:0.84rem;}
.kline .spk{margin-left:auto;background:none;border:none;cursor:pointer;font-size:1.05rem;}
.typing{align-self:flex-start;color:#99a;font-size:0.85rem;padding:6px 15px;}
.inbar{display:flex;gap:8px;padding:12px 16px 16px;border-top:1px solid #eee;}
.inbar input{flex:1;border:1.5px solid #d8daf0;border-radius:22px;padding:12px 16px;font-family:inherit;font-size:0.92rem;outline:none;}
.inbar input:focus{border-color:var(--indigo);}
.inbar button{background:var(--indigo);color:#fff;border:none;border-radius:22px;padding:0 20px;font-weight:700;cursor:pointer;font-family:inherit;}
.foot{text-align:center;font-size:0.76rem;color:#9a9fc0;margin-top:16px;line-height:1.7;}
.foot a{color:var(--indigo);}
</style>
</head>
<body>
<div class="hero">
  <div class="top">
    <div>
      <div class="logo">Learn <span>Korean</span> with AI</div>
      <div class="tag">Real conversation · pronunciation · your language</div>
    </div>
    <div class="langs" id="langs"></div>
  </div>
</div>

<div class="wrap">
  <div class="topics" id="topics"></div>
  <div class="card">
    <div class="chat" id="chat"></div>
    <div class="inbar">
      <input id="inp" placeholder="Ask anything, e.g. 'How do I order coffee?'">
      <button id="send">Send</button>
    </div>
  </div>
  <p class="foot">AI Korean tutor · powered by WonderfulCrew AI<br>Practice free · <a href="korean-plans.html">Go Premium</a></p>
</div>

<script>
var LANGS=[
  {c:'en',f:'🇺🇸',n:'English'},{c:'vi',f:'🇻🇳',n:'Tiếng Việt'},{c:'ja',f:'🇯🇵',n:'日本語'},
  {c:'zh',f:'🇨🇳',n:'中文'},{c:'id',f:'🇮🇩',n:'Indonesia'},{c:'es',f:'🇪🇸',n:'Español'}
];
var LNAME={en:'English',vi:'Vietnamese',ja:'Japanese',zh:'Chinese',id:'Indonesian',es:'Spanish'};
var TTSK='ko-KR';
var TOPICS={
  en:['Greetings','Travel','Food & Cafe','Shopping','K-Drama phrases','Business'],
  vi:['Chào hỏi','Du lịch','Đồ ăn & Cafe','Mua sắm','Câu K-Drama','Kinh doanh'],
  ja:['あいさつ','旅行','食事・カフェ','ショッピング','Kドラマ表現','ビジネス'],
  zh:['问候','旅行','美食・咖啡','购物','韩剧台词','商务'],
  id:['Sapaan','Perjalanan','Makanan & Kafe','Belanja','Frasa K-Drama','Bisnis'],
  es:['Saludos','Viajes','Comida y Café','Compras','Frases K-Drama','Negocios']
};
var TOPIC_EN=['Greetings','Travel','Food and Cafe','Shopping','K-Drama phrases','Business'];
var lang='en', convHist=[], topic='Greetings';

function SYS(){
  return 'You are a friendly, encouraging Korean language tutor for adult learners. The learner speaks '+LNAME[lang]+'. Current topic: '+topic+'. '+
  'When the learner asks how to say something or asks about a situation, teach 2-4 useful Korean expressions. '+
  'Format EACH expression on its own line EXACTLY as: 한국어 문장 | romanization | translation in '+LNAME[lang]+'. '+
  'Use a real space-pipe-space " | " as separator so it can be parsed. After the lines, add one short friendly tip in '+LNAME[lang]+' (no pipes on that line). '+
  'Keep Korean natural and polite (해요체 by default). NEVER use markdown, asterisks (*), hashes (#), backticks, headers, or horizontal rules. Plain text only.';
}
function renderLangs(){
  var el=document.getElementById('langs');el.innerHTML='';
  LANGS.forEach(function(L){var b=document.createElement('button');b.textContent=L.f+' '+L.n;b.className=(L.c===lang?'on':'');
    b.onclick=function(){lang=L.c;convHist=[];renderLangs();renderTopics();resetChat();};el.appendChild(b);});
}
function renderTopics(){
  var el=document.getElementById('topics');el.innerHTML='';
  var labels=TOPICS[lang]||TOPICS.en;
  labels.forEach(function(lb,i){var b=document.createElement('button');b.textContent=lb;b.className=(TOPIC_EN[i]===topic?'on':'');
    b.onclick=function(){topic=TOPIC_EN[i];renderTopics();askTopic(lb);};el.appendChild(b);});
}
function resetChat(){
  document.getElementById('chat').innerHTML='';
  var greet={en:'Hi! I am your AI Korean tutor. Pick a topic or ask me how to say anything in Korean 😊',vi:'Xin chào! Tôi là gia sư tiếng Hàn AI. Chọn chủ đề hoặc hỏi cách nói bất cứ điều gì 😊',ja:'こんにちは！AI韓国語チューターです。トピックを選ぶか、何でも聞いてね 😊',zh:'你好！我是AI韩语老师。选个话题，或问我怎么用韩语说 😊',id:'Halo! Saya tutor bahasa Korea AI. Pilih topik atau tanya apa saja 😊',es:'¡Hola! Soy tu tutor de coreano con IA. Elige un tema o pregúntame 😊'};
  addBot(greet[lang]||greet.en);
}
function addMe(t){var c=document.getElementById('chat');var d=document.createElement('div');d.className='msg me';d.textContent=t;c.appendChild(d);c.scrollTop=c.scrollHeight;}
function addBot(text){
  var c=document.getElementById('chat');var d=document.createElement('div');d.className='msg bot';
  var html='<div class="who">🎓 Tutor</div>';
  text.split('\n').forEach(function(line){
    line=line.replace(/[*`#]/g,'').replace(/^[-=]{3,}$/,'').trim(); if(!line) return;
    var parts=line.split(' | ');
    if(parts.length>=2){
      var ko=parts[0], ro=parts[1]||'', tr=parts[2]||'';
      html+='<div class="kline"><div><div class="ko">'+esc(ko)+'</div><div class="ro">'+esc(ro)+'</div><div class="tr">'+esc(tr)+'</div></div><button class="spk" data-ko="'+esc(ko)+'">🔊</button></div>';
    } else {
      html+='<div style="margin-top:6px;">'+esc(line)+'</div>';
    }
  });
  d.innerHTML=html;
  c.appendChild(d);
  [].slice.call(d.querySelectorAll('.spk')).forEach(function(b){b.onclick=function(){speak(b.getAttribute('data-ko'));};});
  c.scrollTop=c.scrollHeight;
}
function esc(s){return String(s).replace(/[&<>"]/g,function(x){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[x];});}
function speak(t){try{if('speechSynthesis' in window){speechSynthesis.cancel();var u=new SpeechSynthesisUtterance(t);u.lang=TTSK;u.rate=0.92;var vs=speechSynthesis.getVoices();var v=vs.find(function(x){return x.lang==='ko-KR';});if(v)u.voice=v;speechSynthesis.speak(u);}}catch(e){}}

async function send(q){
  if(!q||!q.trim())return;
  addMe(q); convHist.push({role:'user',content:q});
  var c=document.getElementById('chat');var t=document.createElement('div');t.className='typing';t.textContent='···';c.appendChild(t);c.scrollTop=c.scrollHeight;
  try{
    var res=await fetch('/api/ai',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({model:'claude-haiku-4-5-20251001',max_tokens:500,system:SYS(),messages:convHist})});
    var data=await res.json();
    var txt=(data&&data.content&&data.content[0]&&data.content[0].text)||(data&&data.text)||'';
    t.remove();
    if(!txt){addBot('Sorry, please try again.');return;}
    convHist.push({role:'assistant',content:txt});
    addBot(txt);
  }catch(e){t.remove();addBot('Network error. Please try again.');}
}
function askTopic(label){
  var q={en:'Teach me useful Korean for: '+topic,vi:'Dạy tôi tiếng Hàn hữu ích về: '+topic,ja:topic+'で使う韓国語を教えて',zh:'教我关于'+topic+'的实用韩语',id:'Ajari saya bahasa Korea untuk: '+topic,es:'Enséñame coreano útil para: '+topic}[lang];
  send(q||('Teach me useful Korean for: '+topic));
}
document.getElementById('send').onclick=function(){var i=document.getElementById('inp');send(i.value);i.value='';};
document.getElementById('inp').addEventListener('keydown',function(e){if(e.key==='Enter'){send(this.value);this.value='';}});
renderLangs();renderTopics();resetChat();
</script>
</body>
</html>
